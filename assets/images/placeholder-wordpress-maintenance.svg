<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" role="img" aria-hidden="true">
  <title>Abstract dark tech visual representing a recurring WordPress maintenance checklist</title>
  <defs>
    <radialGradient id="bgFademnt" cx="50%" cy="36%" r="78%">
      <stop offset="0%" stop-color="#141f38"/>
      <stop offset="100%" stop-color="#0a1020"/>
    </radialGradient>
    <pattern id="gridmnt" width="64" height="64" patternUnits="userSpaceOnUse">
      <path d="M 64 0 L 0 0 0 64" fill="none" stroke="rgba(148,163,184,0.10)" stroke-width="1"/>
    </pattern>
    <radialGradient id="gridMaskmnt" cx="50%" cy="32%" r="70%">
      <stop offset="0%" stop-color="#fff" stop-opacity="0.9"/>
      <stop offset="65%" stop-color="#fff" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <mask id="gridMaskElmnt">
      <rect width="1280" height="720" fill="url(#gridMaskmnt)"/>
    </mask>
    <radialGradient id="gIndigo_mnt" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#4f46e5" stop-opacity="0.46"/>
      <stop offset="66%" stop-color="#4f46e5" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="gGreen_mnt" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6ee7b7" stop-opacity="0.4"/>
      <stop offset="66%" stop-color="#6ee7b7" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1280" height="720" fill="url(#bgFademnt)"/>
  <rect width="1280" height="720" fill="url(#gridmnt)" mask="url(#gridMaskElmnt)"/>
  <circle cx="380" cy="230" r="320" fill="url(#gIndigo_mnt)"/><circle cx="980" cy="500" r="320" fill="url(#gGreen_mnt)"/>

  <rect x="700" y="260" width="220" height="280" rx="14" fill="#0a1020" fill-opacity="0.55" stroke="#a5b4fc" stroke-width="2.5"/>
  <rect x="770" y="248" width="80" height="24" rx="6" fill="#141f38" stroke="#a5b4fc" stroke-width="2"/>

  <g stroke="#6ee7b7" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M 730 320 L 745 335 L 770 305"/>
  </g>
  <line x1="790" y1="318" x2="890" y2="318" stroke="#e2e8f0" stroke-width="4" opacity="0.55"/>

  <g stroke="#6ee7b7" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M 730 380 L 745 395 L 770 365"/>
  </g>
  <line x1="790" y1="378" x2="890" y2="378" stroke="#e2e8f0" stroke-width="4" opacity="0.55"/>

  <g stroke="#fca5a5" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.9">
    <circle cx="740" cy="450" r="14" fill="none"/>
    <line x1="734" y1="444" x2="746" y2="456"/>
    <line x1="746" y1="444" x2="734" y2="456"/>
  </g>
  <line x1="790" y1="450" x2="890" y2="450" stroke="#fca5a5" stroke-width="4" opacity="0.5"/>
</svg>
