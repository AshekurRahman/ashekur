      <stop offset="66%" stop-color="#fca5a5" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1280" height="720" fill="url(#bgFadeews)"/>
  <rect width="1280" height="720" fill="url(#gridews)" mask="url(#gridMaskElews)"/>
  <circle cx="380" cy="230" r="320" fill="url(#gA_ews)"/><circle cx="980" cy="500" r="320" fill="url(#gB_ews)"/>
  <rect x="720" y="260" width="230" height="180" rx="10" fill="#f8fafc" opacity="0.92"/>
  <rect x="720" y="260" width="230" height="30" rx="8" fill="#141f38"/>
  <circle cx="740" cy="275" r="5" fill="#fca5a5"/>
