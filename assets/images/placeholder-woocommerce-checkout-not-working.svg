<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" role="img" aria-hidden="true">
  <title>Abstract dark tech visual representing a WooCommerce checkout that fails to complete</title>
  <defs>
    <radialGradient id="bgFade_wcc" cx="50%" cy="36%" r="78%">
      <stop offset="0%" stop-color="#141f38"/>
      <stop offset="100%" stop-color="#0a1020"/>
    </radialGradient>
    <pattern id="grid_wcc" width="64" height="64" patternUnits="userSpaceOnUse">
      <path d="M 64 0 L 0 0 0 64" fill="none" stroke="rgba(148,163,184,0.10)" stroke-width="1"/>
    </pattern>
    <radialGradient id="gridMask_wcc" cx="50%" cy="32%" r="70%">
      <stop offset="0%" stop-color="#fff" stop-opacity="0.9"/>
      <stop offset="65%" stop-color="#fff" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <mask id="gridMaskEl_wcc">
      <rect width="1280" height="720" fill="url(#gridMask_wcc)"/>
    </mask>
    <radialGradient id="gPink_wcc" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7c3aed" stop-opacity="0.45"/>
      <stop offset="66%" stop-color="#7c3aed" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="gIndigo_wcc" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#4f46e5" stop-opacity="0.4"/>
      <stop offset="66%" stop-color="#4f46e5" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="gDanger_wcc" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fca5a5" stop-opacity="0.5"/>
      <stop offset="66%" stop-color="#fca5a5" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1280" height="720" fill="url(#bgFade_wcc)"/>
  <rect width="1280" height="720" fill="url(#grid_wcc)" mask="url(#gridMaskEl_wcc)"/>
  <circle cx="360" cy="220" r="340" fill="url(#gPink_wcc)"/><circle cx="980" cy="560" r="360" fill="url(#gIndigo_wcc)"/><circle cx="860" cy="380" r="140" fill="url(#gDanger_wcc)"/>

  <!-- shopping cart -->
  <g transform="translate(430,300)" stroke="#a5b4fc" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M0 0 H30 L55 90 H160 L182 20 H48"/>
    <circle cx="72" cy="118" r="12" fill="#141b2b" stroke="#a5b4fc" stroke-width="5"/>
    <circle cx="150" cy="118" r="12" fill="#141b2b" stroke="#a5b4fc" stroke-width="5"/>
  </g>

  <!-- three-step progress: Cart -> Checkout -> Payment, last step broken -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#8aa0b9" letter-spacing="1">
    <line x1="700" y1="330" x2="1000" y2="330" stroke="rgba(148,163,184,0.35)" stroke-width="3"/>
    <line x1="700" y1="330" x2="850" y2="330" stroke="#818cf8" stroke-width="3"/>
    <circle cx="700" cy="330" r="10" fill="#818cf8"/>
    <circle cx="850" cy="330" r="10" fill="#818cf8"/>
    <circle cx="1000" cy="330" r="12" fill="#1d2142" stroke="#fca5a5" stroke-width="3"/>
    <line x1="993" y1="323" x2="1007" y2="337" stroke="#fca5a5" stroke-width="3" stroke-linecap="round"/>
    <line x1="1007" y1="323" x2="993" y2="337" stroke="#fca5a5" stroke-width="3" stroke-linecap="round"/>
    <text x="700" y="365" text-anchor="middle">CART</text>
    <text x="850" y="365" text-anchor="middle">CHECKOUT</text>
    <text x="1000" y="365" text-anchor="middle" fill="#fca5a5">PAYMENT</text>
  </g>
  <text x="850" y="470" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#fca5a5" letter-spacing="1">ORDER NOT PLACED</text>
</svg>
