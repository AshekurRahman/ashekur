<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" role="img" aria-hidden="true">
  <title>Abstract dark tech visual representing an old website layout transforming into a redesigned one</title>
  <defs>
    <radialGradient id="bgFadeR" cx="50%" cy="36%" r="78%">
      <stop offset="0%" stop-color="#141f38"/>
      <stop offset="100%" stop-color="#0a1020"/>
    </radialGradient>
    <pattern id="gridR" width="64" height="64" patternUnits="userSpaceOnUse">
      <path d="M 64 0 L 0 0 0 64" fill="none" stroke="rgba(148,163,184,0.10)" stroke-width="1"/>
    </pattern>
    <radialGradient id="gridMaskR" cx="50%" cy="32%" r="70%">
      <stop offset="0%" stop-color="#fff" stop-opacity="0.9"/>
      <stop offset="65%" stop-color="#fff" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <mask id="gridMaskElR">
      <rect width="1280" height="720" fill="url(#gridMaskR)"/>
    </mask>
    <radialGradient id="gIndigo_R" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#4f46e5" stop-opacity="0.46"/>
      <stop offset="66%" stop-color="#4f46e5" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="gGreen_R" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6ee7b7" stop-opacity="0.4"/>
      <stop offset="66%" stop-color="#6ee7b7" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1280" height="720" fill="url(#bgFadeR)"/>
  <rect width="1280" height="720" fill="url(#gridR)" mask="url(#gridMaskElR)"/>
  <circle cx="380" cy="230" r="320" fill="url(#gIndigo_R)"/><circle cx="980" cy="500" r="320" fill="url(#gGreen_R)"/>

  <!-- old layout, faded -->
  <rect x="660" y="270" width="150" height="200" rx="6" fill="none" stroke="#94a3b8" stroke-width="2" opacity="0.55"/>
  <line x1="672" y1="292" x2="798" y2="292" stroke="#94a3b8" stroke-width="4" opacity="0.55"/>
  <line x1="672" y1="316" x2="760" y2="316" stroke="#94a3b8" stroke-width="3" opacity="0.4"/>
  <rect x="672" y="340" width="126" height="60" fill="none" stroke="#94a3b8" stroke-width="2" opacity="0.4"/>
  <line x1="672" y1="420" x2="740" y2="420" stroke="#94a3b8" stroke-width="3" opacity="0.4"/>

  <path d="M 830 370 L 900 370" stroke="#e2e8f0" stroke-width="4" opacity="0.7"/>
  <path d="M 888 358 L 904 370 L 888 382" fill="none" stroke="#e2e8f0" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" opacity="0.7"/>

  <!-- new layout -->
  <rect x="930" y="250" width="180" height="240" rx="10" fill="#0a1020" fill-opacity="0.5" stroke="#6ee7b7" stroke-width="2.5"/>
  <line x1="948" y1="280" x2="1092" y2="280" stroke="#6ee7b7" stroke-width="6"/>
  <line x1="948" y1="306" x2="1030" y2="306" stroke="#6ee7b7" stroke-width="3" opacity="0.6"/>
  <rect x="948" y="330" width="72" height="60" rx="6" fill="none" stroke="#6ee7b7" stroke-width="2" opacity="0.8"/>
  <rect x="1028" y="330" width="64" height="60" rx="6" fill="none" stroke="#6ee7b7" stroke-width="2" opacity="0.8"/>
  <rect x="948" y="404" width="90" height="26" rx="13" fill="#6ee7b7" opacity="0.85"/>
</svg>
