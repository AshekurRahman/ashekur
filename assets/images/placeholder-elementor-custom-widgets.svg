<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" role="img" aria-hidden="true">
  <title>Abstract dark tech visual representing a custom Elementor widget being built</title>
  <defs>
    <radialGradient id="bgFadeecw" cx="50%" cy="36%" r="78%">
      <stop offset="0%" stop-color="#141f38"/>
      <stop offset="100%" stop-color="#0a1020"/>
    </radialGradient>
    <pattern id="gridecw" width="64" height="64" patternUnits="userSpaceOnUse">
      <path d="M 64 0 L 0 0 0 64" fill="none" stroke="rgba(148,163,184,0.10)" stroke-width="1"/>
    </pattern>
    <radialGradient id="gridMaskecw" cx="50%" cy="32%" r="70%">
      <stop offset="0%" stop-color="#fff" stop-opacity="0.9"/>
      <stop offset="65%" stop-color="#fff" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <mask id="gridMaskElecw">
      <rect width="1280" height="720" fill="url(#gridMaskecw)"/>
    </mask>

    <radialGradient id="gBlue_ecw" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2563eb" stop-opacity="0.48"/>
      <stop offset="66%" stop-color="#2563eb" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="gPink_ecw" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f472b6" stop-opacity="0.34"/>
      <stop offset="66%" stop-color="#f472b6" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1280" height="720" fill="url(#bgFadeecw)"/>
  <rect width="1280" height="720" fill="url(#gridecw)" mask="url(#gridMaskElecw)"/>
  <circle cx="340" cy="220" r="340" fill="url(#gBlue_ecw)"/><circle cx="980" cy="540" r="360" fill="url(#gPink_ecw)"/>

  <!-- a code panel beside a widget control panel -->
  <g>
    <rect x="620" y="220" width="220" height="240" rx="10" fill="#0a1020" stroke="#a5b4fc" stroke-width="2" opacity="0.9"/>
    <rect x="620" y="220" width="220" height="28" rx="10" fill="#141f38" stroke="#a5b4fc" stroke-width="2" opacity="0.9"/>
    <circle cx="638" cy="234" r="4" fill="#f472b6"/>
    <circle cx="652" cy="234" r="4" fill="#a5b4fc"/>
    <circle cx="666" cy="234" r="4" fill="#6ee7b7"/>
    <rect x="636" y="264" width="60" height="8" rx="2" fill="#6ee7b7" opacity="0.8"/>
    <rect x="636" y="282" width="140" height="8" rx="2" fill="#a5b4fc" opacity="0.5"/>
    <rect x="652" y="300" width="120" height="8" rx="2" fill="#a5b4fc" opacity="0.5"/>
    <rect x="652" y="318" width="100" height="8" rx="2" fill="#a5b4fc" opacity="0.5"/>
    <rect x="636" y="336" width="30" height="8" rx="2" fill="#f472b6" opacity="0.8"/>

    <rect x="860" y="220" width="220" height="240" rx="10" fill="#0a1020" stroke="#a5b4fc" stroke-width="2" opacity="0.9"/>
    <rect x="860" y="220" width="220" height="28" rx="10" fill="#141f38" stroke="#a5b4fc" stroke-width="2" opacity="0.9"/>
    <rect x="878" y="264" width="184" height="20" rx="4" fill="none" stroke="#a5b4fc" stroke-width="1.5" opacity="0.6"/>
    <rect x="878" y="296" width="184" height="20" rx="4" fill="none" stroke="#a5b4fc" stroke-width="1.5" opacity="0.6"/>
    <rect x="878" y="328" width="184" height="20" rx="4" fill="none" stroke="#6ee7b7" stroke-width="1.5" stroke-dasharray="5 4" opacity="0.85"/>
    <circle cx="890" cy="368" r="7" fill="#2563eb" opacity="0.7"/>
    <rect x="906" y="362" width="156" height="12" rx="6" fill="#a5b4fc" opacity="0.35"/>
  </g>
  <path d="M 810 380 L 850 380" stroke="#f472b6" stroke-width="2" stroke-dasharray="4 4" opacity="0.7"/>
  <path d="M 840 372 L 850 380 L 840 388" fill="none" stroke="#f472b6" stroke-width="2" opacity="0.7"/>

  <g fill="#a5b4fc" opacity="0.4">
    <rect x="500" y="480" width="18" height="18" rx="3"/>
    <rect x="1120" y="200" width="16" height="16" rx="3"/>
    <rect x="560" y="180" width="14" height="14" rx="3"/>
  </g>
</svg>
