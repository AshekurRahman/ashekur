<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" role="img" aria-hidden="true">
  <title>Abstract dark tech visual representing a blacklisted site shield turning into a cleared, verified shield</title>
  <defs>
    <radialGradient id="bgFadeblk" cx="50%" cy="36%" r="78%">
      <stop offset="0%" stop-color="#141f38"/>
      <stop offset="100%" stop-color="#0a1020"/>
    </radialGradient>
    <pattern id="gridblk" width="64" height="64" patternUnits="userSpaceOnUse">
      <path d="M 64 0 L 0 0 0 64" fill="none" stroke="rgba(148,163,184,0.10)" stroke-width="1"/>
    </pattern>
    <radialGradient id="gridMaskblk" cx="50%" cy="32%" r="70%">
      <stop offset="0%" stop-color="#fff" stop-opacity="0.9"/>
      <stop offset="65%" stop-color="#fff" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <mask id="gridMaskElblk">
      <rect width="1280" height="720" fill="url(#gridMaskblk)"/>
    </mask>
    <radialGradient id="gDanger_blk" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fca5a5" stop-opacity="0.4"/>
      <stop offset="66%" stop-color="#fca5a5" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="gGreen_blk" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6ee7b7" stop-opacity="0.42"/>
      <stop offset="66%" stop-color="#6ee7b7" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1280" height="720" fill="url(#bgFadeblk)"/>
  <rect width="1280" height="720" fill="url(#gridblk)" mask="url(#gridMaskElblk)"/>
  <circle cx="380" cy="240" r="320" fill="url(#gDanger_blk)"/><circle cx="980" cy="500" r="320" fill="url(#gGreen_blk)"/>

  <!-- flagged shield on the left -->
  <path d="M 740 250 L 820 280 L 820 380 Q 820 440 740 480 Q 660 440 660 380 L 660 280 Z"
        fill="#0a1020" fill-opacity="0.5" stroke="#fca5a5" stroke-width="3" stroke-linejoin="round" opacity="0.95"/>
  <line x1="740" y1="310" x2="740" y2="370" stroke="#fca5a5" stroke-width="6" stroke-linecap="round"/>
  <circle cx="740" cy="400" r="4" fill="#fca5a5"/>

  <!-- arrow -->
  <line x1="850" y1="360" x2="930" y2="360" stroke="#e2e8f0" stroke-width="4" opacity="0.7"/>
  <path d="M 918 348 L 934 360 L 918 372" fill="none" stroke="#e2e8f0" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" opacity="0.7"/>

  <!-- cleared shield on the right -->
  <path d="M 1020 250 L 1100 280 L 1100 380 Q 1100 440 1020 480 Q 940 440 940 380 L 940 280 Z"
        fill="#0a1020" fill-opacity="0.5" stroke="#6ee7b7" stroke-width="3" stroke-linejoin="round" opacity="0.95"/>
  <path d="M 992 372 L 1012 394 L 1050 344" fill="none" stroke="#6ee7b7" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
