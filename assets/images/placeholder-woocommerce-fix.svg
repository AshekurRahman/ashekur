<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" role="img" aria-hidden="true">
  <title>Abstract dark tech visual representing a WooCommerce checkout fix</title>
  <defs>
    <radialGradient id="bgFadewoo" cx="50%" cy="36%" r="78%">
      <stop offset="0%" stop-color="#141f38"/>
      <stop offset="100%" stop-color="#0a1020"/>
    </radialGradient>
    <pattern id="gridwoo" width="64" height="64" patternUnits="userSpaceOnUse">
      <path d="M 64 0 L 0 0 0 64" fill="none" stroke="rgba(148,163,184,0.10)" stroke-width="1"/>
    </pattern>
    <radialGradient id="gridMaskwoo" cx="50%" cy="32%" r="70%">
      <stop offset="0%" stop-color="#fff" stop-opacity="0.9"/>
      <stop offset="65%" stop-color="#fff" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <mask id="gridMaskElwoo">
      <rect width="1280" height="720" fill="url(#gridMaskwoo)"/>
    </mask>

    <radialGradient id="gBlue_woo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2563eb" stop-opacity="0.48"/>
      <stop offset="66%" stop-color="#2563eb" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="gGreen_woo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#34d399" stop-opacity="0.38"/>
      <stop offset="66%" stop-color="#34d399" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1280" height="720" fill="url(#bgFadewoo)"/>
  <rect width="1280" height="720" fill="url(#gridwoo)" mask="url(#gridMaskElwoo)"/>
  <circle cx="340" cy="220" r="340" fill="url(#gBlue_woo)"/><circle cx="980" cy="540" r="360" fill="url(#gGreen_woo)"/>
  
  <g fill="none" stroke="#a5b4fc" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.85">
    <path d="M 780 320 L 800 260 Q 860 220 920 260 L 940 320" />
    <path d="M 760 320 L 960 320 L 940 460 Q 940 480 920 480 L 800 480 Q 780 480 780 460 Z" />
  </g>
  <circle cx="960" cy="460" r="34" fill="#0a1020" stroke="#6ee7b7" stroke-width="2.5" opacity="0.95"/>
  <path d="M 946 460 L 957 471 L 977 448" fill="none" stroke="#6ee7b7" stroke-width="3.5"
        stroke-linecap="round" stroke-linejoin="round"/>
  <g fill="#a5b4fc" opacity="0.4">
    <rect x="600" y="380" width="18" height="18" rx="3"/>
    <rect x="1060" y="260" width="16" height="16" rx="3"/>
    <rect x="640" y="500" width="14" height="14" rx="3"/>
  </g>

</svg>
