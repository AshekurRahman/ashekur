<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" role="img" aria-hidden="true">
  <title>Abstract dark tech visual representing custom content fields attached to a post type</title>
  <defs>
    <radialGradient id="bgFadecpt" cx="50%" cy="36%" r="78%">
      <stop offset="0%" stop-color="#141f38"/>
      <stop offset="100%" stop-color="#0a1020"/>
    </radialGradient>
    <pattern id="gridcpt" width="64" height="64" patternUnits="userSpaceOnUse">
      <path d="M 64 0 L 0 0 0 64" fill="none" stroke="rgba(148,163,184,0.10)" stroke-width="1"/>
    </pattern>
    <radialGradient id="gridMaskcpt" cx="50%" cy="32%" r="70%">
      <stop offset="0%" stop-color="#fff" stop-opacity="0.9"/>
      <stop offset="65%" stop-color="#fff" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <mask id="gridMaskElcpt">
      <rect width="1280" height="720" fill="url(#gridMaskcpt)"/>
    </mask>
    <radialGradient id="gA_cpt" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#4f46e5" stop-opacity="0.46"/>
      <stop offset="66%" stop-color="#4f46e5" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="gB_cpt" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6ee7b7" stop-opacity="0.4"/>
      <stop offset="66%" stop-color="#6ee7b7" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1280" height="720" fill="url(#bgFadecpt)"/>
  <rect width="1280" height="720" fill="url(#gridcpt)" mask="url(#gridMaskElcpt)"/>
  <circle cx="380" cy="230" r="320" fill="url(#gA_cpt)"/><circle cx="980" cy="500" r="320" fill="url(#gB_cpt)"/>
  <rect x="740" y="300" width="200" height="34" rx="6" fill="#a5b4fc" opacity="0.25"/>
  <rect x="740" y="300" width="200" height="34" rx="6" fill="none" stroke="#a5b4fc" stroke-width="2.5"/>
  <rect x="740" y="344" width="150" height="20" rx="4" fill="none" stroke="#6ee7b7" stroke-width="2" opacity="0.8"/>
  <rect x="740" y="374" width="170" height="20" rx="4" fill="none" stroke="#6ee7b7" stroke-width="2" opacity="0.8"/>
  <rect x="740" y="404" width="130" height="20" rx="4" fill="none" stroke="#6ee7b7" stroke-width="2" opacity="0.8"/>
</svg>
