<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" role="img" aria-hidden="true">
  <title>Abstract dark tech visual representing a recurring update calendar checklist</title>
  <defs>
    <radialGradient id="bgFadeuma" cx="50%" cy="36%" r="78%">
      <stop offset="0%" stop-color="#141f38"/>
      <stop offset="100%" stop-color="#0a1020"/>
    </radialGradient>
    <pattern id="griduma" width="64" height="64" patternUnits="userSpaceOnUse">
      <path d="M 64 0 L 0 0 0 64" fill="none" stroke="rgba(148,163,184,0.10)" stroke-width="1"/>
    </pattern>
    <radialGradient id="gridMaskuma" cx="50%" cy="32%" r="70%">
      <stop offset="0%" stop-color="#fff" stop-opacity="0.9"/>
      <stop offset="65%" stop-color="#fff" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <mask id="gridMaskEluma">
      <rect width="1280" height="720" fill="url(#gridMaskuma)"/>
    </mask>
    <radialGradient id="gA_uma" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#4f46e5" stop-opacity="0.46"/>
      <stop offset="66%" stop-color="#4f46e5" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="gB_uma" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6ee7b7" stop-opacity="0.4"/>
      <stop offset="66%" stop-color="#6ee7b7" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1280" height="720" fill="url(#bgFadeuma)"/>
  <rect width="1280" height="720" fill="url(#griduma)" mask="url(#gridMaskEluma)"/>
  <circle cx="380" cy="230" r="320" fill="url(#gA_uma)"/><circle cx="980" cy="500" r="320" fill="url(#gB_uma)"/>
  <rect x="760" y="290" width="180" height="180" rx="12" fill="#0a1020" fill-opacity="0.55" stroke="#a5b4fc" stroke-width="2.5"/>
  <rect x="800" y="278" width="100" height="24" rx="6" fill="#141f38" stroke="#a5b4fc" stroke-width="2"/>
  <g stroke="#6ee7b7" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M 790 350 L 805 365 L 830 335"/>
    <path d="M 790 400 L 805 415 L 830 385"/>
  </g>
  <line x1="850" y1="352" x2="910" y2="352" stroke="#e2e8f0" stroke-width="3" opacity="0.5"/>
  <line x1="850" y1="402" x2="910" y2="402" stroke="#e2e8f0" stroke-width="3" opacity="0.5"/>
