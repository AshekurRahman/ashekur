<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" role="img" aria-hidden="true">
  <title>Abstract dark tech visual representing a CDN network of nodes with a cached checkmark</title>
  <defs>
    <radialGradient id="bgFadecdn" cx="50%" cy="36%" r="78%">
      <stop offset="0%" stop-color="#141f38"/>
      <stop offset="100%" stop-color="#0a1020"/>
    </radialGradient>
    <pattern id="gridcdn" width="64" height="64" patternUnits="userSpaceOnUse">
      <path d="M 64 0 L 0 0 0 64" fill="none" stroke="rgba(148,163,184,0.10)" stroke-width="1"/>
    </pattern>
    <radialGradient id="gridMaskcdn" cx="50%" cy="32%" r="70%">
      <stop offset="0%" stop-color="#fff" stop-opacity="0.9"/>
      <stop offset="65%" stop-color="#fff" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <mask id="gridMaskElcdn">
      <rect width="1280" height="720" fill="url(#gridMaskcdn)"/>
    </mask>
    <radialGradient id="gA_cdn" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#4f46e5" stop-opacity="0.46"/>
      <stop offset="66%" stop-color="#4f46e5" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="gB_cdn" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6ee7b7" stop-opacity="0.4"/>
      <stop offset="66%" stop-color="#6ee7b7" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1280" height="720" fill="url(#bgFadecdn)"/>
  <rect width="1280" height="720" fill="url(#gridcdn)" mask="url(#gridMaskElcdn)"/>
  <circle cx="380" cy="230" r="320" fill="url(#gA_cdn)"/><circle cx="980" cy="500" r="320" fill="url(#gB_cdn)"/>
  <circle cx="860" cy="360" r="10" fill="#a5b4fc"/>
  <circle cx="780" cy="420" r="10" fill="#a5b4fc"/>
  <circle cx="940" cy="420" r="10" fill="#a5b4fc"/>
  <circle cx="860" cy="460" r="10" fill="#a5b4fc"/>
  <line x1="860" y1="360" x2="780" y2="420" stroke="#a5b4fc" stroke-width="2.5" opacity="0.6"/>
  <line x1="860" y1="360" x2="940" y2="420" stroke="#a5b4fc" stroke-width="2.5" opacity="0.6"/>
  <line x1="780" y1="420" x2="860" y2="460" stroke="#a5b4fc" stroke-width="2.5" opacity="0.6"/>
  <line x1="940" y1="420" x2="860" y2="460" stroke="#a5b4fc" stroke-width="2.5" opacity="0.6"/>
  <path d="M 838 358 L 852 372 L 878 344" fill="none" stroke="#6ee7b7" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
