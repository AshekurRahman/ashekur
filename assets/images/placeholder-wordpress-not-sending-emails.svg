<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" role="img" aria-hidden="true">
  <title>Abstract dark tech visual representing WordPress mail failing to leave the server</title>
  <defs>
    <radialGradient id="bgFadewme" cx="50%" cy="36%" r="78%">
      <stop offset="0%" stop-color="#141f38"/>
      <stop offset="100%" stop-color="#0a1020"/>
    </radialGradient>
    <pattern id="gridwme" width="64" height="64" patternUnits="userSpaceOnUse">
      <path d="M 64 0 L 0 0 0 64" fill="none" stroke="rgba(148,163,184,0.10)" stroke-width="1"/>
    </pattern>
    <radialGradient id="gridMaskwme" cx="50%" cy="32%" r="70%">
      <stop offset="0%" stop-color="#fff" stop-opacity="0.9"/>
      <stop offset="65%" stop-color="#fff" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <mask id="gridMaskElwme">
      <rect width="1280" height="720" fill="url(#gridMaskwme)"/>
    </mask>
    <radialGradient id="gA_wme" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#4f46e5" stop-opacity="0.46"/>
      <stop offset="66%" stop-color="#4f46e5" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="gB_wme" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fca5a5" stop-opacity="0.4"/>
      <stop offset="66%" stop-color="#fca5a5" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1280" height="720" fill="url(#bgFadewme)"/>
  <rect width="1280" height="720" fill="url(#gridwme)" mask="url(#gridMaskElwme)"/>
  <circle cx="380" cy="230" r="320" fill="url(#gA_wme)"/><circle cx="980" cy="500" r="320" fill="url(#gB_wme)"/>
  <rect x="700" y="330" width="160" height="110" rx="8" fill="none" stroke="#a5b4fc" stroke-width="3"/>
  <path d="M 700 330 L 780 390 L 860 330" fill="none" stroke="#a5b4fc" stroke-width="3"/>
  <circle cx="960" cy="385" r="46" fill="none" stroke="rgba(148,163,184,0.3)" stroke-width="3" stroke-dasharray="6 5"/>
  <line x1="925" y1="350" x2="995" y2="420" stroke="#fca5a5" stroke-width="5" stroke-linecap="round"/>
</svg>
