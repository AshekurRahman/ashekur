<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" role="img" aria-hidden="true">
  <title>Abstract dark tech visual representing a WordPress database connection error</title>
  <defs>
    <radialGradient id="bgFade_dbe" cx="50%" cy="36%" r="78%">
      <stop offset="0%" stop-color="#141f38"/>
      <stop offset="100%" stop-color="#0a1020"/>
    </radialGradient>
    <pattern id="grid_dbe" width="64" height="64" patternUnits="userSpaceOnUse">
      <path d="M 64 0 L 0 0 0 64" fill="none" stroke="rgba(148,163,184,0.10)" stroke-width="1"/>
    </pattern>
    <radialGradient id="gridMask_dbe" cx="50%" cy="32%" r="70%">
      <stop offset="0%" stop-color="#fff" stop-opacity="0.9"/>
      <stop offset="65%" stop-color="#fff" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <mask id="gridMaskEl_dbe">
      <rect width="1280" height="720" fill="url(#gridMask_dbe)"/>
    </mask>
    <radialGradient id="gPink_dbe" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7c3aed" stop-opacity="0.45"/>
      <stop offset="66%" stop-color="#7c3aed" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="gIndigo_dbe" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#4f46e5" stop-opacity="0.4"/>
      <stop offset="66%" stop-color="#4f46e5" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="gDanger_dbe" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fca5a5" stop-opacity="0.55"/>
      <stop offset="66%" stop-color="#fca5a5" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1280" height="720" fill="url(#bgFade_dbe)"/>
  <rect width="1280" height="720" fill="url(#grid_dbe)" mask="url(#gridMaskEl_dbe)"/>
  <circle cx="360" cy="220" r="340" fill="url(#gPink_dbe)"/><circle cx="980" cy="560" r="360" fill="url(#gIndigo_dbe)"/><circle cx="810" cy="360" r="160" fill="url(#gDanger_dbe)"/>

  <!-- database cylinder on the left -->
  <g opacity="0.9">
    <ellipse cx="435" cy="270" rx="80" ry="24" fill="#1d2142" stroke="#475569" stroke-width="1.5"/>
    <path d="M 355 270 L 355 420 A 80 24 0 0 0 515 420 L 515 270" fill="#141b2b" stroke="#475569" stroke-width="1.5"/>
    <ellipse cx="435" cy="420" rx="80" ry="24" fill="#1a2036" stroke="#475569" stroke-width="1.5"/>
    <path d="M 355 330 A 80 24 0 0 0 515 330" fill="none" stroke="#475569" stroke-width="1.2" opacity="0.7"/>
    <path d="M 355 375 A 80 24 0 0 0 515 375" fill="none" stroke="#475569" stroke-width="1.2" opacity="0.7"/>
  </g>
  <!-- broken connection line -->
  <g stroke="#fca5a5" stroke-width="3" stroke-linecap="round" opacity="0.8">
    <line x1="518" y1="345" x2="565" y2="345"/>
    <line x1="585" y1="345" x2="620" y2="345"/>
    <circle cx="573" cy="345" r="6" fill="#fca5a5"/>
  </g>

  <!-- browser frame with error text -->
  <g>
    <rect x="640" y="220" width="380" height="240" rx="10" fill="#141b2b" stroke="#fca5a5" stroke-width="1.5" opacity="0.95"/>
    <rect x="640" y="220" width="380" height="34" rx="10" fill="#1d2142"/>
    <circle cx="662" cy="237" r="4" fill="#fca5a5"/>
    <circle cx="678" cy="237" r="4" fill="#475569"/>
    <circle cx="694" cy="237" r="4" fill="#475569"/>
    <text x="830" y="330" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-weight="600" font-size="28" fill="#fca5a5" opacity="0.95">Error establishing</text>
    <text x="830" y="365" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-weight="600" font-size="28" fill="#fca5a5" opacity="0.95">a database connection</text>
  </g>
  <text x="760" y="528" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#8aa0b9" letter-spacing="1">DATABASE CONNECTION ERROR</text>
</svg>
