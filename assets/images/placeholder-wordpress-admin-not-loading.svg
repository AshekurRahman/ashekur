<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" role="img" aria-hidden="true">
  <title>Abstract dark tech visual representing a blank wp-admin dashboard panel</title>
  <defs>
    <radialGradient id="bgFadeadm" cx="50%" cy="36%" r="78%">
      <stop offset="0%" stop-color="#141f38"/>
      <stop offset="100%" stop-color="#0a1020"/>
    </radialGradient>
    <pattern id="gridadm" width="64" height="64" patternUnits="userSpaceOnUse">
      <path d="M 64 0 L 0 0 0 64" fill="none" stroke="rgba(148,163,184,0.10)" stroke-width="1"/>
    </pattern>
    <radialGradient id="gridMaskadm" cx="50%" cy="32%" r="70%">
      <stop offset="0%" stop-color="#fff" stop-opacity="0.9"/>
      <stop offset="65%" stop-color="#fff" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <mask id="gridMaskEladm">
      <rect width="1280" height="720" fill="url(#gridMaskadm)"/>
    </mask>
    <radialGradient id="gA_adm" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#4f46e5" stop-opacity="0.46"/>
      <stop offset="66%" stop-color="#4f46e5" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="gB_adm" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fca5a5" stop-opacity="0.4"/>
      <stop offset="66%" stop-color="#fca5a5" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1280" height="720" fill="url(#bgFadeadm)"/>
  <rect width="1280" height="720" fill="url(#gridadm)" mask="url(#gridMaskEladm)"/>
  <circle cx="380" cy="230" r="320" fill="url(#gA_adm)"/><circle cx="980" cy="500" r="320" fill="url(#gB_adm)"/>
  <rect x="720" y="270" width="220" height="160" rx="10" fill="#0a1020" fill-opacity="0.6" stroke="#a5b4fc" stroke-width="2.5"/>
  <rect x="720" y="270" width="220" height="34" rx="10" fill="#141f38" stroke="#a5b4fc" stroke-width="1.5"/>
  <circle cx="740" cy="287" r="5" fill="#fca5a5"/>
  <line x1="750" y1="340" x2="900" y2="340" stroke="#fca5a5" stroke-width="4" opacity="0.7"/>
  <line x1="750" y1="365" x2="860" y2="365" stroke="#fca5a5" stroke-width="4" opacity="0.5"/>
  <line x1="750" y1="390" x2="880" y2="390" stroke="#fca5a5" stroke-width="4" opacity="0.35"/>
