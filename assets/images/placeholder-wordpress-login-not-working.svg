<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" role="img" aria-hidden="true">
  <title>Abstract dark tech visual representing a WordPress login loop and lockout</title>
  <defs>
    <radialGradient id="bgFade_login" cx="50%" cy="36%" r="78%">
      <stop offset="0%" stop-color="#141f38"/>
      <stop offset="100%" stop-color="#0a1020"/>
    </radialGradient>
    <pattern id="grid_login" width="64" height="64" patternUnits="userSpaceOnUse">
      <path d="M 64 0 L 0 0 0 64" fill="none" stroke="rgba(148,163,184,0.10)" stroke-width="1"/>
    </pattern>
    <radialGradient id="gridMask_login" cx="50%" cy="32%" r="70%">
      <stop offset="0%" stop-color="#fff" stop-opacity="0.9"/>
      <stop offset="65%" stop-color="#fff" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <mask id="gridMaskEl_login">
      <rect width="1280" height="720" fill="url(#gridMask_login)"/>
    </mask>
    <radialGradient id="gPink_login" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7c3aed" stop-opacity="0.45"/>
      <stop offset="66%" stop-color="#7c3aed" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="gIndigo_login" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#4f46e5" stop-opacity="0.4"/>
      <stop offset="66%" stop-color="#4f46e5" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="gDanger_login" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fca5a5" stop-opacity="0.5"/>
      <stop offset="66%" stop-color="#fca5a5" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1280" height="720" fill="url(#bgFade_login)"/>
  <rect width="1280" height="720" fill="url(#grid_login)" mask="url(#gridMaskEl_login)"/>
  <circle cx="360" cy="220" r="340" fill="url(#gPink_login)"/><circle cx="980" cy="560" r="360" fill="url(#gIndigo_login)"/><circle cx="860" cy="380" r="140" fill="url(#gDanger_login)"/>

  <!-- login form card -->
  <rect x="440" y="190" width="360" height="340" rx="12" fill="#141b2b" stroke="#818cf8" stroke-width="1.5" opacity="0.9"/>
  <rect x="440" y="190" width="360" height="34" rx="12" fill="#1d2142"/>
  <circle cx="462" cy="207" r="4" fill="#fca5a5"/>
  <circle cx="478" cy="207" r="4" fill="#475569"/>
  <circle cx="494" cy="207" r="4" fill="#475569"/>

  <!-- padlock -->
  <g transform="translate(620,268)">
    <rect x="-20" y="-2" width="40" height="32" rx="6" fill="#1d2142" stroke="#a5b4fc" stroke-width="2.5"/>
    <path d="M -12 -2 L -12 -16 A 12 12 0 0 1 12 -16 L 12 -2" fill="none" stroke="#a5b4fc" stroke-width="2.5"/>
    <circle cx="0" cy="14" r="4" fill="#fca5a5"/>
  </g>

  <!-- username / password fields -->
  <g fill="none" stroke="#475569" stroke-width="6" stroke-linecap="round" opacity="0.65">
    <line x1="470" y1="352" x2="770" y2="352"/>
    <line x1="470" y1="384" x2="770" y2="384"/>
  </g>

  <!-- button -->
  <rect x="470" y="424" width="300" height="38" rx="8" fill="#312e81" stroke="#a5b4fc" stroke-width="1.5"/>
  <text x="620" y="449" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#c7d2fe" letter-spacing="1">LOG IN</text>

  <!-- looping redirect arrow -->
  <g transform="translate(940,360)">
    <path d="M -46 0 A 46 46 0 1 1 -6 44" fill="none" stroke="#fca5a5" stroke-width="6" stroke-linecap="round"/>
    <path d="M -6 44 L -22 34 M -6 44 L -16 60" fill="none" stroke="#fca5a5" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text x="940" y="490" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#8aa0b9" letter-spacing="1">REDIRECT LOOP</text>
</svg>
