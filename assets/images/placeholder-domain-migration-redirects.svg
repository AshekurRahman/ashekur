<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" role="img" aria-hidden="true">
  <title>Abstract dark tech visual representing two domains connected by a 301 redirect path</title>
  <defs>
    <radialGradient id="bgFadedom" cx="50%" cy="36%" r="78%">
      <stop offset="0%" stop-color="#141f38"/>
      <stop offset="100%" stop-color="#0a1020"/>
    </radialGradient>
    <pattern id="griddom" width="64" height="64" patternUnits="userSpaceOnUse">
      <path d="M 64 0 L 0 0 0 64" fill="none" stroke="rgba(148,163,184,0.10)" stroke-width="1"/>
    </pattern>
    <radialGradient id="gridMaskdom" cx="50%" cy="32%" r="70%">
      <stop offset="0%" stop-color="#fff" stop-opacity="0.9"/>
      <stop offset="65%" stop-color="#fff" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <mask id="gridMaskEldom">
      <rect width="1280" height="720" fill="url(#gridMaskdom)"/>
    </mask>
    <radialGradient id="gIndigo_dom" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#4f46e5" stop-opacity="0.46"/>
      <stop offset="66%" stop-color="#4f46e5" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="gGreen_dom" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6ee7b7" stop-opacity="0.4"/>
      <stop offset="66%" stop-color="#6ee7b7" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1280" height="720" fill="url(#bgFadedom)"/>
  <rect width="1280" height="720" fill="url(#griddom)" mask="url(#gridMaskEldom)"/>
  <circle cx="380" cy="240" r="320" fill="url(#gIndigo_dom)"/><circle cx="980" cy="480" r="320" fill="url(#gGreen_dom)"/>

  <circle cx="700" cy="360" r="52" fill="none" stroke="#a5b4fc" stroke-width="4"/>
  <path d="M 648 360 A 52 52 0 0 1 700 308 M 700 412 A 52 52 0 0 1 752 360" stroke="#a5b4fc" stroke-width="3" fill="none" opacity="0.6"/>
  <line x1="648" y1="360" x2="752" y2="360" stroke="#a5b4fc" stroke-width="3" opacity="0.6"/>
  <line x1="700" y1="308" x2="700" y2="412" stroke="#a5b4fc" stroke-width="3" opacity="0.6"/>

  <line x1="770" y1="360" x2="900" y2="360" stroke="#6ee7b7" stroke-width="4" stroke-dasharray="10 8"/>
  <path d="M 886 346 L 904 360 L 886 374" fill="none" stroke="#6ee7b7" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="778" y="326" width="46" height="24" rx="5" fill="#0a1020" stroke="#6ee7b7" stroke-width="1.5"/>
  <text x="801" y="343" text-anchor="middle" font-family="monospace" font-size="13" fill="#6ee7b7">301</text>

  <circle cx="980" cy="360" r="52" fill="none" stroke="#6ee7b7" stroke-width="4"/>
  <path d="M 928 360 A 52 52 0 0 1 980 308 M 980 412 A 52 52 0 0 1 1032 360" stroke="#6ee7b7" stroke-width="3" fill="none" opacity="0.7"/>
  <line x1="928" y1="360" x2="1032" y2="360" stroke="#6ee7b7" stroke-width="3" opacity="0.7"/>
  <line x1="980" y1="308" x2="980" y2="412" stroke="#6ee7b7" stroke-width="3" opacity="0.7"/>
</svg>
