<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" role="img" aria-hidden="true">
  <title>Abstract dark tech visual representing a WordPress page rendering without its stylesheet</title>
  <defs>
    <radialGradient id="bgFade_css" cx="50%" cy="36%" r="78%">
      <stop offset="0%" stop-color="#141f38"/>
      <stop offset="100%" stop-color="#0a1020"/>
    </radialGradient>
    <pattern id="grid_css" width="64" height="64" patternUnits="userSpaceOnUse">
      <path d="M 64 0 L 0 0 0 64" fill="none" stroke="rgba(148,163,184,0.10)" stroke-width="1"/>
    </pattern>
    <radialGradient id="gridMask_css" cx="50%" cy="32%" r="70%">
      <stop offset="0%" stop-color="#fff" stop-opacity="0.9"/>
      <stop offset="65%" stop-color="#fff" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <mask id="gridMaskEl_css">
      <rect width="1280" height="720" fill="url(#gridMask_css)"/>
    </mask>
    <radialGradient id="gPink_css" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7c3aed" stop-opacity="0.45"/>
      <stop offset="66%" stop-color="#7c3aed" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="gIndigo_css" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#4f46e5" stop-opacity="0.4"/>
      <stop offset="66%" stop-color="#4f46e5" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="gDanger_css" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fca5a5" stop-opacity="0.5"/>
      <stop offset="66%" stop-color="#fca5a5" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1280" height="720" fill="url(#bgFade_css)"/>
  <rect width="1280" height="720" fill="url(#grid_css)" mask="url(#gridMaskEl_css)"/>
  <circle cx="360" cy="220" r="340" fill="url(#gPink_css)"/><circle cx="980" cy="560" r="360" fill="url(#gIndigo_css)"/><circle cx="860" cy="380" r="140" fill="url(#gDanger_css)"/>

  <!-- left: unstyled browser window, plain stacked text lines -->
  <rect x="220" y="200" width="330" height="320" rx="10" fill="#141b2b" stroke="#475569" stroke-width="1.5" opacity="0.9"/>
  <rect x="220" y="200" width="330" height="32" rx="10" fill="#1d2142"/>
  <circle cx="241" cy="216" r="4" fill="#fca5a5"/>
  <circle cx="257" cy="216" r="4" fill="#475569"/>
  <circle cx="273" cy="216" r="4" fill="#475569"/>
  <g stroke="#8aa0b9" stroke-width="3" stroke-linecap="round" opacity="0.55">
    <line x1="244" y1="256" x2="440" y2="256"/>
    <line x1="244" y1="276" x2="520" y2="276"/>
    <line x1="244" y1="296" x2="470" y2="296"/>
    <line x1="244" y1="326" x2="500" y2="326"/>
    <line x1="244" y1="346" x2="410" y2="346"/>
    <line x1="244" y1="366" x2="490" y2="366"/>
    <line x1="244" y1="396" x2="450" y2="396"/>
    <line x1="244" y1="416" x2="480" y2="416"/>
    <line x1="244" y1="436" x2="380" y2="436"/>
  </g>
  <text x="244" y="490" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#fca5a5" letter-spacing="0.5">NO STYLESHEET</text>

  <!-- right: styled card version -->
  <rect x="700" y="200" width="330" height="320" rx="10" fill="#141b2b" stroke="#818cf8" stroke-width="1.5" opacity="0.9"/>
  <rect x="700" y="200" width="330" height="32" rx="10" fill="#1d2142"/>
  <circle cx="721" cy="216" r="4" fill="#86efac"/>
  <circle cx="737" cy="216" r="4" fill="#475569"/>
  <circle cx="753" cy="216" r="4" fill="#475569"/>
  <rect x="724" y="254" width="282" height="70" rx="8" fill="#232a48"/>
  <rect x="724" y="254" width="6" height="70" rx="3" fill="#a5b4fc"/>
  <g stroke="#c7d2fe" stroke-width="3" stroke-linecap="round" opacity="0.8">
    <line x1="746" y1="276" x2="900" y2="276"/>
    <line x1="746" y1="296" x2="960" y2="296"/>
  </g>
  <rect x="724" y="338" width="130" height="90" rx="8" fill="#232a48"/>
  <rect x="866" y="338" width="140" height="90" rx="8" fill="#232a48"/>
  <rect x="724" y="446" width="282" height="34" rx="8" fill="#4f46e5" opacity="0.85"/>
  <text x="865" y="467" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#e0e7ff" letter-spacing="0.5">STYLED</text>

  <!-- broken chain link between the two -->
  <g transform="translate(625,360)" stroke="#fca5a5" stroke-width="6" stroke-linecap="round" fill="none">
    <path d="M -34 -14 A 16 16 0 1 1 -34 14"/>
    <path d="M 30 -14 A 16 16 0 1 0 30 14"/>
    <line x1="-6" y1="-6" x2="4" y2="4"/>
    <line x1="4" y1="-6" x2="-6" y2="4"/>
  </g>
</svg>
