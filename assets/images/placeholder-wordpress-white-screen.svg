<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" role="img" aria-hidden="true">
  <title>Abstract dark tech visual representing a WordPress site showing a blank white screen</title>
  <defs>
    <radialGradient id="bgFadews" cx="50%" cy="36%" r="78%">
      <stop offset="0%" stop-color="#141f38"/>
      <stop offset="100%" stop-color="#0a1020"/>
    </radialGradient>
    <pattern id="gridws" width="64" height="64" patternUnits="userSpaceOnUse">
      <path d="M 64 0 L 0 0 0 64" fill="none" stroke="rgba(148,163,184,0.10)" stroke-width="1"/>
    </pattern>
    <radialGradient id="gridMaskws" cx="50%" cy="32%" r="70%">
      <stop offset="0%" stop-color="#fff" stop-opacity="0.9"/>
      <stop offset="65%" stop-color="#fff" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <mask id="gridMaskElws">
      <rect width="1280" height="720" fill="url(#gridMaskws)"/>
    </mask>
    <radialGradient id="gBlue_ws" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2563eb" stop-opacity="0.45"/>
      <stop offset="66%" stop-color="#2563eb" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="gIndigo_ws" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#4f46e5" stop-opacity="0.4"/>
      <stop offset="66%" stop-color="#4f46e5" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1280" height="720" fill="url(#bgFadews)"/>
  <rect width="1280" height="720" fill="url(#gridws)" mask="url(#gridMaskElws)"/>
  <circle cx="360" cy="220" r="340" fill="url(#gBlue_ws)"/><circle cx="980" cy="560" r="360" fill="url(#gIndigo_ws)"/>

  <!-- browser frame around a completely blank, brightly lit page: the site returns nothing -->
  <rect x="410" y="190" width="540" height="360" rx="10" fill="#141b2b" stroke="#818cf8" stroke-width="1.5" opacity="0.9"/>
  <rect x="410" y="190" width="540" height="34" rx="10" fill="#1d2142"/>
  <circle cx="432" cy="207" r="4" fill="#fca5a5"/>
  <circle cx="448" cy="207" r="4" fill="#475569"/>
  <circle cx="464" cy="207" r="4" fill="#475569"/>
  <rect x="486" y="199" width="330" height="16" rx="8" fill="#0a1020"/>
  <rect x="410" y="224" width="540" height="326" fill="#fdfdff"/>

  <!-- a faint ghost outline hints at where content should have rendered -->
  <g fill="none" stroke="#cbd5e1" stroke-width="1.4" stroke-dasharray="5 7" opacity="0.6">
    <rect x="450" y="264" width="180" height="18"/>
    <rect x="450" y="300" width="460" height="10"/>
    <rect x="450" y="322" width="460" height="10"/>
    <rect x="450" y="344" width="300" height="10"/>
  </g>

  <text x="680" y="500" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" fill="#c0cedd" letter-spacing="0.5">0 bytes rendered</text>

  <g stroke="#fca5a5" stroke-width="2.2" fill="none" stroke-linecap="round" opacity="0.85">
    <path d="M 1000 300 L 1060 300 L 1060 340 L 1100 340"/>
  </g>
  <circle cx="1000" cy="300" r="4" fill="#fca5a5"/>
  <path d="M 1090 328 L 1100 340 L 1090 352" fill="none" stroke="#fca5a5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="1000" y="288" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#fca5a5" letter-spacing="0.5">debug.log</text>
</svg>
