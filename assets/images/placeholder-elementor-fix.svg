<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" role="img" aria-hidden="true">
  <title>Abstract dark tech visual representing an Elementor layout fix</title>
  <defs>
    <radialGradient id="bgFadeelem" cx="50%" cy="36%" r="78%">
      <stop offset="0%" stop-color="#141f38"/>
      <stop offset="100%" stop-color="#0a1020"/>
    </radialGradient>
    <pattern id="gridelem" width="64" height="64" patternUnits="userSpaceOnUse">
      <path d="M 64 0 L 0 0 0 64" fill="none" stroke="rgba(148,163,184,0.10)" stroke-width="1"/>
    </pattern>
    <radialGradient id="gridMaskelem" cx="50%" cy="32%" r="70%">
      <stop offset="0%" stop-color="#fff" stop-opacity="0.9"/>
      <stop offset="65%" stop-color="#fff" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <mask id="gridMaskElelem">
      <rect width="1280" height="720" fill="url(#gridMaskelem)"/>
    </mask>

    <radialGradient id="gIndigo_elem" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#4f46e5" stop-opacity="0.48"/>
      <stop offset="66%" stop-color="#4f46e5" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="gPurple_elem" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7c3aed" stop-opacity="0.4"/>
      <stop offset="66%" stop-color="#7c3aed" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1280" height="720" fill="url(#bgFadeelem)"/>
  <rect width="1280" height="720" fill="url(#gridelem)" mask="url(#gridMaskElelem)"/>
  <circle cx="340" cy="200" r="340" fill="url(#gIndigo_elem)"/><circle cx="980" cy="540" r="380" fill="url(#gPurple_elem)"/>
  
  <g fill="none" stroke-linejoin="round">
    <rect x="700" y="240" width="220" height="150" rx="14" transform="rotate(-7 810 315)"
          stroke="#a5b4fc" stroke-width="2" opacity="0.45"/>
    <rect x="640" y="360" width="200" height="140" rx="14" transform="rotate(5 740 430)"
          stroke="#c4b5fd" stroke-width="2" opacity="0.5"/>
    <rect x="820" y="330" width="230" height="160" rx="16"
          stroke="#818cf8" stroke-width="2.5" opacity="0.95" fill="#4f46e5" fill-opacity="0.08"/>
  </g>
  <g stroke="#eef2ff" stroke-width="2" stroke-linecap="round">
    <circle cx="1040" cy="340" r="9" fill="none" opacity="0.9"/>
    <line x1="1040" y1="331" x2="1040" y2="349" opacity="0.9"/>
    <line x1="1031" y1="340" x2="1049" y2="340" opacity="0.9"/>
  </g>

</svg>
