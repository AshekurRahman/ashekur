<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" role="img" aria-hidden="true">
  <title>Abstract dark tech visual representing a WordPress PHP memory exhausted fatal error</title>
  <defs>
    <radialGradient id="bgFade_mem" cx="50%" cy="36%" r="78%">
      <stop offset="0%" stop-color="#141f38"/>
      <stop offset="100%" stop-color="#0a1020"/>
    </radialGradient>
    <pattern id="grid_mem" width="64" height="64" patternUnits="userSpaceOnUse">
      <path d="M 64 0 L 0 0 0 64" fill="none" stroke="rgba(148,163,184,0.10)" stroke-width="1"/>
    </pattern>
    <radialGradient id="gridMask_mem" cx="50%" cy="32%" r="70%">
      <stop offset="0%" stop-color="#fff" stop-opacity="0.9"/>
      <stop offset="65%" stop-color="#fff" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <mask id="gridMaskEl_mem">
      <rect width="1280" height="720" fill="url(#gridMask_mem)"/>
    </mask>
    <radialGradient id="gPink_mem" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7c3aed" stop-opacity="0.45"/>
      <stop offset="66%" stop-color="#7c3aed" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="gIndigo_mem" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#4f46e5" stop-opacity="0.4"/>
      <stop offset="66%" stop-color="#4f46e5" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="gDanger_mem" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fca5a5" stop-opacity="0.55"/>
      <stop offset="66%" stop-color="#fca5a5" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1280" height="720" fill="url(#bgFade_mem)"/>
  <rect width="1280" height="720" fill="url(#grid_mem)" mask="url(#gridMaskEl_mem)"/>
  <circle cx="360" cy="220" r="340" fill="url(#gPink_mem)"/><circle cx="980" cy="560" r="360" fill="url(#gIndigo_mem)"/><circle cx="810" cy="360" r="160" fill="url(#gDanger_mem)"/>

  <!-- memory gauge on the left, needle maxed out -->
  <g opacity="0.9">
    <circle cx="440" cy="350" r="110" fill="#141b2b" stroke="#475569" stroke-width="1.5"/>
    <path d="M 350 350 A 90 90 0 0 1 530 350" fill="none" stroke="#334155" stroke-width="14" stroke-linecap="round"/>
    <path d="M 350 350 A 90 90 0 0 1 505 288" fill="none" stroke="#4ade80" stroke-width="14" stroke-linecap="round"/>
    <path d="M 505 288 A 90 90 0 0 1 530 350" fill="none" stroke="#fca5a5" stroke-width="14" stroke-linecap="round"/>
    <line x1="440" y1="350" x2="512" y2="300" stroke="#fca5a5" stroke-width="4" stroke-linecap="round"/>
    <circle cx="440" cy="350" r="8" fill="#fca5a5"/>
    <text x="440" y="410" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#8aa0b9">MEMORY_LIMIT</text>
  </g>

  <!-- browser frame with error text -->
  <g>
    <rect x="600" y="200" width="420" height="270" rx="10" fill="#141b2b" stroke="#fca5a5" stroke-width="1.5" opacity="0.95"/>
    <rect x="600" y="200" width="420" height="34" rx="10" fill="#1d2142"/>
    <circle cx="622" cy="217" r="4" fill="#fca5a5"/>
    <circle cx="638" cy="217" r="4" fill="#475569"/>
    <circle cx="654" cy="217" r="4" fill="#475569"/>
    <text x="810" y="290" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-weight="600" font-size="22" fill="#fca5a5" opacity="0.95">Fatal error: Allowed</text>
    <text x="810" y="322" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-weight="600" font-size="22" fill="#fca5a5" opacity="0.95">memory size exhausted</text>
    <text x="810" y="365" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" fill="#8aa0b9" opacity="0.85">(tried to allocate 20480 bytes)</text>
  </g>
  <text x="760" y="548" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#8aa0b9" letter-spacing="1">PHP MEMORY EXHAUSTED</text>
</svg>
