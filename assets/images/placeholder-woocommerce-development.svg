<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" role="img" aria-hidden="true">
  <title>Abstract dark tech visual representing custom WooCommerce feature development</title>
  <defs>
    <radialGradient id="bgFadewcd" cx="50%" cy="36%" r="78%">
      <stop offset="0%" stop-color="#141f38"/>
      <stop offset="100%" stop-color="#0a1020"/>
    </radialGradient>
    <pattern id="gridwcd" width="64" height="64" patternUnits="userSpaceOnUse">
      <path d="M 64 0 L 0 0 0 64" fill="none" stroke="rgba(148,163,184,0.10)" stroke-width="1"/>
    </pattern>
    <radialGradient id="gridMaskwcd" cx="50%" cy="32%" r="70%">
      <stop offset="0%" stop-color="#fff" stop-opacity="0.9"/>
      <stop offset="65%" stop-color="#fff" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <mask id="gridMaskElwcd">
      <rect width="1280" height="720" fill="url(#gridMaskwcd)"/>
    </mask>

    <radialGradient id="gGreen_wcd" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#34d399" stop-opacity="0.42"/>
      <stop offset="66%" stop-color="#34d399" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="gBlue_wcd" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2563eb" stop-opacity="0.42"/>
      <stop offset="66%" stop-color="#2563eb" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1280" height="720" fill="url(#bgFadewcd)"/>
  <rect width="1280" height="720" fill="url(#gridwcd)" mask="url(#gridMaskElwcd)"/>
  <circle cx="340" cy="220" r="340" fill="url(#gGreen_wcd)"/><circle cx="980" cy="540" r="360" fill="url(#gBlue_wcd)"/>

  <!-- a product/cart card with a recurring-billing badge, standing in for custom store features -->
  <g>
    <rect x="760" y="250" width="260" height="200" rx="10" fill="#0a1020" stroke="#6ee7b7" stroke-width="2" opacity="0.9"/>
    <rect x="784" y="274" width="90" height="70" rx="6" fill="none" stroke="#a5b4fc" stroke-width="2" opacity="0.7"/>
    <rect x="890" y="274" width="106" height="14" rx="3" fill="#a5b4fc" opacity="0.45"/>
    <rect x="890" y="296" width="80" height="10" rx="3" fill="#a5b4fc" opacity="0.28"/>
    <rect x="784" y="362" width="212" height="1" fill="#a5b4fc" opacity="0.25"/>
    <rect x="784" y="382" width="120" height="14" rx="3" fill="#6ee7b7" opacity="0.55"/>
    <rect x="784" y="404" width="212" height="26" rx="6" fill="#2563eb" opacity="0.5"/>
  </g>
  <!-- recurring / subscription cycle arrows -->
  <g fill="none" stroke="#6ee7b7" stroke-width="2.5" stroke-linecap="round">
    <path d="M 1050 300 A 40 40 0 1 1 1010 260" opacity="0.9"/>
    <path d="M 1010 260 L 1000 252 L 1018 246 Z" fill="#6ee7b7" stroke="none" opacity="0.9"/>
  </g>

  <g fill="#a5b4fc" opacity="0.4">
    <rect x="600" y="480" width="18" height="18" rx="3"/>
    <rect x="1080" y="420" width="16" height="16" rx="3"/>
    <rect x="700" y="180" width="14" height="14" rx="3"/>
  </g>
</svg>
